[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securemodelgate"
version = "0.3.0"
description = "Signed, calibrated behavioral-lineage attestation for admitting third-party AI models at Kubernetes admission."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Dharanidharan Senthilkumar" }]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
securemodelgate = "securemodelgate.cli:main"

[tool.setuptools]
packages = ["securemodelgate", "securemodelgate.lineage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
